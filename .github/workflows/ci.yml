name: CI

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:

jobs:
  quality:
    name: PHP lint, PHPCS, tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: zip

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS (WordPress)
        run: vendor/bin/phpcs

      - name: Unit tests
        run: php tests/run.php

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: oli-download-plugin
          exclude-directories: |
            tests
            vendor
            .github
          exclude-files: |
            composer.json
            composer.lock
            phpcs.xml.dist
            CHANGELOG.md
            LICENSE
            .gitignore
            .gitattributes
            .distignore
            BACKLOG.md
            README.md
